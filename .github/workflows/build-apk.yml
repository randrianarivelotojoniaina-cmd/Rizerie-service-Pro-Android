
name: Compiler APK Rizerie V2.7 Android QR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Recuperer les fichiers GitHub
        uses: actions/checkout@v4

      - name: Extraire le ZIP Android
        run: |
          set -e
          unzip -q Rizerie_V2_7_Android_QR_Source.zip -d source
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tester le moteur de correction
        working-directory: source
        run: node tests/sync_correction_mobile.test.js

      - name: Compiler APK Android
        working-directory: source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier APK de test
        uses: actions/upload-artifact@v4
        with:
          name: Rizerie-V2-7-Android-QR-APK-Test
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
