
name: Compiler APK Rizerie V2.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Recuperer le ZIP
        uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          unzip -q Rizerie_V2_6_Icone_Officielle_Source.zip -d source
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle

      - name: Corriger erreur Java ligne 70
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "source/android/app/src/main/java/"
              "mg/rizerie/servicepro/MainActivity.java"
          )

          code = p.read_text(encoding="utf-8")
          ancien = "db.close()}"
          nouveau = "db.close();}"

          if ancien in code:
              code = code.replace(ancien, nouveau)
              p.write_text(code, encoding="utf-8")
              print("Correction Java appliquee")
          elif nouveau in code:
              print("Correction deja presente")
          else:
              raise RuntimeError(
                  "Code Java inattendu : verifier MainActivity"
              )
          PY

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK
        working-directory: source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Rizerie-Service-Pro-V2-5-APK
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
