
name: Compiler APK Rizerie V2.5 depuis ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le ZIP
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          set -euo pipefail
          unzip -q Rizerie_V2_5_APK_Source.zip -d source
          test -f source/android/settings.gradle
          test -f source/android/app/build.gradle

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK debug
        working-directory: source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Mettre APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: Rizerie-Service-Pro-V2-5-APK-Debug
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
