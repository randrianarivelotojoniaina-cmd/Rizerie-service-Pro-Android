
name: Compiler APK Rizerie V2.7 QR Correctif

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Extraire le ZIP Android
        run: |
          set -euo pipefail
          unzip -q Rizerie_V27_Android_QR_Correctif_Source.zip -d source
          test -f source/android/app/src/main/java/mg/rizerie/servicepro/QrScannerActivity.java

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tester le correctif
        working-directory: source
        run: node tests/android_qr_contract.test.js

      - name: Compiler APK
        working-directory: source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Rizerie-V27-QR-Correctif-APK
          path: source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
